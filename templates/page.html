<!doctype html>
<!-- Generated by build.py. Edit content.json or templates/page.html instead. -->
<html lang="${locale}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="${description}" />
    <meta name="theme-color" content="#142941" />
    <meta property="og:title" content="${page_title}" />
    <meta property="og:description" content="${social_description}" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="${page_url}" />
    <meta property="og:image" content="${social_image}" />
    <title>${page_title}</title>
    <link rel="canonical" href="${page_url}" />
    <link rel="alternate" hreflang="en" href="${english_url}" />
    <link rel="alternate" hreflang="ko" href="${korean_url}" />
    <link rel="icon" href="${photo}" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="${style_url}" />
    <script src="${script_url}" defer></script>
    <link rel="stylesheet" href="${lightbox_style_url}" />
    <script src="${lightbox_script_url}" defer></script>
    <script src="${lightbox_config_url}" defer></script>
  </head>
  <body data-page="${page_id}">
    <a class="skip-link" href="#main">Skip to content</a>
    <nav id="navbar" aria-label="Main navigation">
      <div class="nav-inner">
        <a href="#hero" class="nav-logo">${name}<span class="logo-mark" aria-hidden="true">.</span></a>
        <div class="sidebar-bio"><p class="sidebar-role">${roles}</p><p class="sidebar-education">${education_summary}</p></div>
        <button class="nav-menu-btn" id="menuBtn" aria-controls="navDrawer" aria-expanded="false" aria-label="Open navigation">Menu <span aria-hidden="true">+</span></button>
      </div>
      <div class="nav-drawer" id="navDrawer"><span class="nav-indicator" id="navIndicator" aria-hidden="true"></span>${navigation}</div>
    </nav>
    <nav class="language-switch" aria-label="Choose language">
      <a class="language-link" href="index.html" lang="en" hreflang="en" aria-current="${english_current}">EN</a>
      <a class="language-link" href="index.ko.html" lang="ko" hreflang="ko" aria-current="${korean_current}">한국어</a>
    </nav>
    <div class="reading-progress" aria-hidden="true"><span id="readingProgress"></span></div>
    <main id="main" tabindex="-1">
      ${page_content}
    </main>
    <footer><div class="footer-inner"><div class="footer-credit">${footer}</div><a href="#main" class="back-top">Back to top <span aria-hidden="true">↑</span></a></div></footer>
  </body>
</html>
